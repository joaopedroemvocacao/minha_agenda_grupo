<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Reuniões</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* TELA DE CARREGAMENTO */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots span {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* ESTILOS PRINCIPAIS */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .tab {
            flex: 1;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s;
            border: none;
            background: none;
            font-size: 16px;
        }

        .tab:hover {
            background: #e9ecef;
        }

        .tab.active {
            color: #667eea;
            background: white;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .btn-edit {
            background: #ffc107;
            color: #333;
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 8px;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .reuniao-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .reuniao-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .reuniao-nome {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .reuniao-id {
            font-size: 11px;
            color: #6c757d;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .reuniao-detalhes {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        .badge-meet {
            background: #d4f5d4;
            color: #2e7d32;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .badge-presencial {
            background: #ffe0b2;
            color: #e65100;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #adb5bd;
        }

        /* MODAL DE EDIÇÃO */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
        }

        /* MODAL DE CONFIRMAÇÃO (POPUP DE CANCELAR) */
        .confirm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 10001;
        }

        .confirm-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .confirm-content h3 {
            color: #dc3545;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .confirm-content p {
            color: #555;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .confirm-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-confirm-yes {
            background: #dc3545;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        .btn-confirm-yes:hover {
            background: #c82333;
        }

        .btn-confirm-no {
            background: #6c757d;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        .btn-confirm-no:hover {
            background: #5a6268;
        }

        /* POPUP DE NOTIFICAÇÃO (TOAST) */
        .toast-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 10000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            min-width: 280px;
            border-left: 4px solid #28a745;
        }

        .toast-notification.show {
            transform: translateX(0);
        }

        .toast-notification.success {
            border-left-color: #28a745;
        }

        .toast-notification.error {
            border-left-color: #dc3545;
        }

        .toast-notification.info {
            border-left-color: #17a2b8;
        }

        .toast-title {
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .toast-title.success {
            color: #28a745;
        }

        .toast-title.error {
            color: #dc3545;
        }

        .toast-message {
            color: #555;
            font-size: 14px;
        }

        .toast-close {
            position: absolute;
            top: 8px;
            right: 12px;
            cursor: pointer;
            color: #999;
            font-size: 18px;
        }

        .toast-close:hover {
            color: #333;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <!-- TELA DE CARREGAMENTO -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">
                Carregando
                <div class="loading-dots">
                    <span>.</span><span>.</span><span>.</span>
                </div>
            </div>
            <p style="margin-top: 20px; font-size: 14px; opacity: 0.8;">Agenda de Reuniões</p>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="mainContent" style="display: none;">
        <div class="container">
            <div class="header">
                <h1>📅 Agenda de Reuniões</h1>
                <p>Organize seus compromissos de forma simples e profissional</p>
            </div>

            <div class="main-card">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('agendar')">➕ Agendar Reunião</button>
                    <button class="tab" onclick="switchTab('ver')">📋 Ver Agenda</button>
                </div>

                <!-- ABA AGENDAR -->
                <div id="agendarTab" class="tab-content active">
                    <h2>Nova Reunião</h2>
                    <form id="agendaForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>📝 Nome da Reunião</label>
                                <input type="text" id="nomeReuniao" placeholder="Ex: Reunião de vendas, Alinhamento, etc" required>
                            </div>
                            <div class="form-group">
                                <label>👤 Nome do Cliente</label>
                                <input type="text" id="nome" placeholder="Digite o nome completo" required>
                            </div>
                            <div class="form-group">
                                <label>📞 Telefone</label>
                                <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
                            </div>
                            <div class="form-group">
                                <label>📅 Data</label>
                                <input type="date" id="data" required>
                            </div>
                            <div class="form-group">
                                <label>⏰ Horário</label>
                                <input type="time" id="horario" required>
                            </div>
                            <div class="form-group full-width">
                                <label>📍 Local da Reunião</label>
                                <select id="local">
                                    <option value="meet">💻 Google Meet (Online)</option>
                                    <option value="Presencial">🏢 Presencial (Escritório)</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary">✅ Agendar Compromisso</button>
                    </form>
                </div>

                <!-- ABA VER AGENDA -->
                <div id="verTab" class="tab-content">
                    <h2>Reuniões Agendadas</h2>
                    <div id="lista"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>✏️ Editar Reunião</h3>
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>📝 Nome da Reunião</label>
                <input type="text" id="editNomeReuniao" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>👤 Nome do Cliente</label>
                <input type="text" id="editNome" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>📞 Telefone</label>
                <input type="text" id="editTelefone" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>📅 Data</label>
                <input type="date" id="editData" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>⏰ Horário</label>
                <input type="time" id="editHorario" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>📍 Local</label>
                <select id="editLocal" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
                    <option value="meet">💻 Google Meet (Online)</option>
                    <option value="Presencial">🏢 Presencial (Escritório)</option>
                </select>
            </div>
            <button onclick="salvarEdicao()" class="btn-primary" style="margin-bottom:10px;">💾 Salvar Alterações</button>
            <button onclick="fecharModal()" style="width:100%; padding:10px; background:#6c757d; color:white; border:none; border-radius:8px; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <!-- MODAL DE CONFIRMAÇÃO (CANCELAR REUNIÃO) -->
    <div id="confirmModal" class="confirm-modal">
        <div class="confirm-content">
            <h3>⚠️ Confirmar</h3>
            <p>Tem certeza que deseja cancelar esta reunião?</p>
            <div class="confirm-buttons">
                <button class="btn-confirm-yes" id="confirmYes">Sim, cancelar</button>
                <button class="btn-confirm-no" id="confirmNo">Não, voltar</button>
            </div>
        </div>
    </div>

    <!-- POPUP DE NOTIFICAÇÃO -->
    <div id="toastNotification" class="toast-notification">
        <span class="toast-close" onclick="fecharToast()">&times;</span>
        <div class="toast-title" id="toastTitle">Sucesso</div>
        <div class="toast-message" id="toastMessage">Mensagem aqui</div>
    </div>

    <script>
        // Variável para guardar o ID da reunião a ser cancelada
        let cancelarId = null;

        // TELA DE CARREGAMENTO
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loadingScreen').style.opacity = '0';
                setTimeout(function() {
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                }, 500);
            }, 800);
        });

        // FUNÇÃO DO POPUP PERSONALIZADO
        function mostrarToast(tipo, titulo, mensagem) {
            const toast = document.getElementById('toastNotification');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');
            
            toast.className = 'toast-notification';
            toast.classList.add(tipo);
            toastTitle.className = 'toast-title ' + tipo;
            
            toastTitle.textContent = titulo;
            toastMessage.textContent = mensagem;
            
            toast.classList.add('show');
            
            setTimeout(() => {
                fecharToast();
            }, 3000);
        }
        
        function fecharToast() {
            const toast = document.getElementById('toastNotification');
            toast.classList.remove('show');
        }

        // FUNÇÃO DO POPUP DE CONFIRMAÇÃO
        function mostrarConfirmacao(id) {
            cancelarId = id;
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function fecharConfirmacao() {
            document.getElementById('confirmModal').style.display = 'none';
            cancelarId = null;
        }

        // Eventos dos botões do modal de confirmação
        document.getElementById('confirmYes').onclick = async function() {
            if(cancelarId) {
                const resposta = await fetch(`/cancelar/${cancelarId}`, { method: 'DELETE' });
                const resultado = await resposta.json();
                if(resultado.sucesso) {
                    mostrarToast('info', '🗑️ Cancelado!', resultado.mensagem);
                } else {
                    mostrarToast('error', '❌ Erro!', resultado.mensagem);
                }
                fecharConfirmacao();
                carregarLista();
            }
        };

        document.getElementById('confirmNo').onclick = function() {
            fecharConfirmacao();
        };

        // TROCAR ABA
        function switchTab(tab) {
            document.getElementById('agendarTab').classList.remove('active');
            document.getElementById('verTab').classList.remove('active');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            if(tab === 'agendar') {
                document.getElementById('agendarTab').classList.add('active');
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else {
                document.getElementById('verTab').classList.add('active');
                document.querySelectorAll('.tab')[1].classList.add('active');
                carregarLista();
            }
        }

        // AGENDAR REUNIÃO
        document.getElementById('agendaForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const dados = {
                nomeReuniao: document.getElementById('nomeReuniao').value,
                nome: document.getElementById('nome').value,
                telefone: document.getElementById('telefone').value,
                data: document.getElementById('data').value,
                horario: document.getElementById('horario').value,
                local: document.getElementById('local').value
            };
            
            const resposta = await fetch('/agendar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });
            
            const resultado = await resposta.json();
            
            if(resultado.sucesso) {
                mostrarToast('success', '✅ Sucesso!', resultado.mensagem);
                document.getElementById('agendaForm').reset();
                if(document.getElementById('verTab').classList.contains('active')) {
                    carregarLista();
                }
            } else {
                mostrarToast('error', '❌ Erro!', resultado.mensagem);
            }
        };

        // CARREGAR LISTA
        async function carregarLista() {
            const resposta = await fetch('/listar');
            const reunioes = await resposta.json();
            const listaDiv = document.getElementById('lista');
            
            if(reunioes.length === 0) {
                listaDiv.innerHTML = '<div class="empty-state">📭 Nenhuma reunião agendada ainda<br><br>Volte para a aba "Agendar" para criar um novo compromisso</div>';
            } else {
                listaDiv.innerHTML = reunioes.map(r => `
                    <div class="reuniao-item">
                        <div class="reuniao-header">
                            <span class="reuniao-nome">📝 ${r.nomeReuniao || 'Sem título'}</span>
                            <span class="reuniao-id">ID: ${r.id}</span>
                        </div>
                        <div class="reuniao-detalhes">
                            <span>👤 ${r.nome}</span>
                            <span>📱 ${r.telefone}</span>
                            <span>📅 ${formatarData(r.data)}</span>
                            <span>⏰ ${r.horario}</span>
                            <span class="${r.local === 'meet' ? 'badge-meet' : 'badge-presencial'}">
                                ${r.local === 'meet' ? '💻 Meet' : '🏢 Presencial'}
                            </span>
                        </div>
                        <div>
                            <button class="btn-edit" onclick="abrirModalEditar(${r.id})">✏️ Editar</button>
                            <button class="btn-delete" onclick="mostrarConfirmacao(${r.id})">🗑️ Cancelar</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function formatarData(data) {
            if(!data) return 'Data não definida';
            const partes = data.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        // EDITAR REUNIÃO
        async function abrirModalEditar(id) {
            const resposta = await fetch(`/buscar/${id}`);
            const resultado = await resposta.json();
            if(resultado.sucesso) {
                const r = resultado.reuniao;
                document.getElementById('editId').value = r.id;
                document.getElementById('editNomeReuniao').value = r.nomeReuniao || '';
                document.getElementById('editNome').value = r.nome;
                document.getElementById('editTelefone').value = r.telefone;
                document.getElementById('editData').value = r.data;
                document.getElementById('editHorario').value = r.horario;
                document.getElementById('editLocal').value = r.local;
                document.getElementById('modal').style.display = 'flex';
            } else {
                mostrarToast('error', '❌ Erro!', resultado.mensagem);
            }
        }

        async function salvarEdicao() {
            const id = document.getElementById('editId').value;
            const dados = {
                nomeReuniao: document.getElementById('editNomeReuniao').value,
                nome: document.getElementById('editNome').value,
                telefone: document.getElementById('editTelefone').value,
                data: document.getElementById('editData').value,
                horario: document.getElementById('editHorario').value,
                local: document.getElementById('editLocal').value
            };
            const resposta = await fetch(`/mudar/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });
            const resultado = await resposta.json();
            if(resultado.sucesso) {
                mostrarToast('success', '✅ Atualizado!', resultado.mensagem);
            } else {
                mostrarToast('error', '❌ Erro!', resultado.mensagem);
            }
            fecharModal();
            carregarLista();
        }

        function fecharModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
