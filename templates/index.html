<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Reuniões</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* TELA DE CARREGAMENTO */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text { color: white; text-align: center; font-size: 20px; }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 40px; }
        .header h1 { font-size: 48px; margin-bottom: 10px; }
        
        .main-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }
        
        .tab {
            flex: 1;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            border: none;
            background: none;
            font-size: 16px;
        }
        
        .tab.active {
            color: #667eea;
            background: white;
            border-bottom: 3px solid #667eea;
        }
        
        .tab-content { display: none; padding: 30px; }
        .tab-content.active { display: block; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full-width { grid-column: span 2; }
        
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 14px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-export {
            background: #17a2b8;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-edit { background: #ffc107; color: #333; padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; margin-right: 8px; }
        .btn-delete { background: #dc3545; color: white; padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; }
        
        .reuniao-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .reuniao-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        
        .reuniao-nome { font-size: 18px; font-weight: 700; }
        .reuniao-detalhes { display: flex; gap: 15px; flex-wrap: wrap; margin: 10px 0; }
        
        .empty-state { text-align: center; padding: 60px; color: #adb5bd; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
        }
        
        .toast-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 10000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            border-left: 4px solid #28a745;
        }
        
        .toast-notification.show { transform: translateX(0); }
        .toast-notification.success { border-left-color: #28a745; }
        .toast-notification.error { border-left-color: #dc3545; }
        
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <!-- TELA DE CARREGAMENTO -->
    <div id="loadingScreen" class="loading-screen">
        <div>
            <div class="spinner"></div>
            <div class="loading-text">Carregando...</div>
        </div>
    </div>

    <!-- CONTEÚDO -->
    <div id="mainContent" style="display: none;">
        <div class="container">
            <div class="header">
                <h1>📅 Agenda de Reuniões</h1>
                <p>Organize seus compromissos</p>
            </div>

            <div class="main-card">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('agendar')">➕ Agendar</button>
                    <button class="tab" onclick="switchTab('ver')">📋 Ver Agenda</button>
                </div>

                <!-- ABA AGENDAR -->
                <div id="agendarTab" class="tab-content active">
                    <h2>Nova Reunião</h2>
                    <form id="agendaForm">
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label>📝 Título</label>
                                <input type="text" id="titulo" required>
                            </div>
                            <div class="form-group full-width">
                                <label>📄 Descrição</label>
                                <textarea id="descricao" rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label>📅 Data</label>
                                <input type="date" id="data" required>
                            </div>
                            <div class="form-group">
                                <label>⏰ Horário Início</label>
                                <input type="time" id="horario_inicio" required>
                            </div>
                            <div class="form-group">
                                <label>⏰ Horário Fim</label>
                                <input type="time" id="horario_fim" required>
                            </div>
                            <div class="form-group">
                                <label>📍 Sala</label>
                                <select id="sala_id">
                                    <option value="">Nenhuma</option>
                                    <option value="1">Sala A</option>
                                    <option value="2">Sala B</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary">✅ Salvar</button>
                    </form>
                </div>

                <!-- ABA VER AGENDA -->
                <div id="verTab" class="tab-content">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                        <h2>Reuniões</h2>
                        <div>
                            <button onclick="carregarLista()" class="btn-secondary">🔄</button>
                            <button onclick="exportarJSON()" class="btn-export">📋 Exportar JSON</button>
                        </div>
                    </div>
                    <div id="lista"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL EDIÇÃO -->
    <div id="modalEdicao" class="modal">
        <div class="modal-content">
            <h3>✏️ Editar</h3>
            <input type="hidden" id="editId">
            <input type="text" id="editTitulo" placeholder="Título" style="width:100%; margin-bottom:10px; padding:10px;">
            <textarea id="editDescricao" rows="3" placeholder="Descrição" style="width:100%; margin-bottom:10px; padding:10px;"></textarea>
            <input type="date" id="editData" style="width:100%; margin-bottom:10px; padding:10px;">
            <input type="time" id="editHorarioInicio" style="width:100%; margin-bottom:10px; padding:10px;">
            <input type="time" id="editHorarioFim" style="width:100%; margin-bottom:10px; padding:10px;">
            <select id="editSalaId" style="width:100%; margin-bottom:10px; padding:10px;">
                <option value="">Nenhuma</option>
                <option value="1">Sala A</option>
                <option value="2">Sala B</option>
            </select>
            <button onclick="salvarEdicao()" class="btn-primary">Salvar</button>
            <button onclick="fecharModal()" style="margin-top:10px; width:100%; padding:10px;">Cancelar</button>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toastNotification" class="toast-notification">
        <div class="toast-title" id="toastTitle">Sucesso</div>
        <div class="toast-message" id="toastMessage"></div>
    </div>

    <script>
        // FECHAR TELA DE CARREGAMENTO
        document.addEventListener('DOMContentLoaded', function() {
            // Esconde a tela de loading após 1 segundo
            setTimeout(function() {
                const loading = document.getElementById('loadingScreen');
                const main = document.getElementById('mainContent');
                if(loading && main) {
                    loading.style.display = 'none';
                    main.style.display = 'block';
                }
            }, 1000);
        });

        function mostrarToast(tipo, titulo, msg) {
            const toast = document.getElementById('toastNotification');
            const title = document.getElementById('toastTitle');
            const message = document.getElementById('toastMessage');
            toast.className = 'toast-notification ' + tipo;
            title.textContent = titulo;
            message.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function switchTab(tab) {
            document.getElementById('agendarTab').classList.remove('active');
            document.getElementById('verTab').classList.remove('active');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            if(tab === 'agendar') {
                document.getElementById('agendarTab').classList.add('active');
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else {
                document.getElementById('verTab').classList.add('active');
                document.querySelectorAll('.tab')[1].classList.add('active');
                carregarLista();
            }
        }

        document.getElementById('agendaForm').onsubmit = async (e) => {
            e.preventDefault();
            const dados = {
                titulo: document.getElementById('titulo').value,
                descricao: document.getElementById('descricao').value,
                data: document.getElementById('data').value,
                horario_inicio: document.getElementById('horario_inicio').value,
                horario_fim: document.getElementById('horario_fim').value,
                sala_id: document.getElementById('sala_id').value
            };
            
            const resposta = await fetch('/agendar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });
            const resultado = await resposta.json();
            mostrarToast(resultado.sucesso ? 'success' : 'error', 
                        resultado.sucesso ? '✅ Sucesso' : '❌ Erro', 
                        resultado.mensagem);
            if(resultado.sucesso) {
                document.getElementById('agendaForm').reset();
                carregarLista();
            }
        };

        async function carregarLista() {
            const resposta = await fetch('/listar');
            const reunioes = await resposta.json();
            const div = document.getElementById('lista');
            
            if(reunioes.length === 0) {
                div.innerHTML = '<div class="empty-state">📭 Nenhuma reunião</div>';
            } else {
                div.innerHTML = reunioes.map(r => `
                    <div class="reuniao-item">
                        <div class="reuniao-header">
                            <span class="reuniao-nome">📝 ${r.titulo}</span>
                            <span>ID: ${r.id}</span>
                        </div>
                        <div class="reuniao-detalhes">
                            <span>📅 ${r.data}</span>
                            <span>⏰ ${r.horario_inicio} - ${r.horario_fim}</span>
                        </div>
                        <div>
                            <button class="btn-edit" onclick="abrirEditar(${r.id})">✏️</button>
                            <button class="btn-delete" onclick="cancelarReuniao(${r.id})">🗑️</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        async function abrirEditar(id) {
            const resposta = await fetch(`/buscar/${id}`);
            const resultado = await resposta.json();
            if(resultado.sucesso) {
                const r = resultado.reuniao;
                document.getElementById('editId').value = r.id;
                document.getElementById('editTitulo').value = r.titulo;
                document.getElementById('editDescricao').value = r.descricao || '';
                document.getElementById('editData').value = r.data;
                document.getElementById('editHorarioInicio').value = r.horario_inicio;
                document.getElementById('editHorarioFim').value = r.horario_fim;
                document.getElementById('editSalaId').value = r.sala_id || '';
                document.getElementById('modalEdicao').style.display = 'flex';
            }
        }

        async function salvarEdicao() {
            const id = document.getElementById('editId').value;
            const dados = {
                titulo: document.getElementById('editTitulo').value,
                descricao: document.getElementById('editDescricao').value,
                data: document.getElementById('editData').value,
                horario_inicio: document.getElementById('editHorarioInicio').value,
                horario_fim: document.getElementById('editHorarioFim').value,
                sala_id: document.getElementById('editSalaId').value
            };
            const resposta = await fetch(`/mudar/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });
            const resultado = await resposta.json();
            mostrarToast('success', '✅', resultado.mensagem);
            fecharModal();
            carregarLista();
        }

        async function cancelarReuniao(id) {
            if(confirm('Cancelar esta reunião?')) {
                const resposta = await fetch(`/cancelar/${id}`, { method: 'DELETE' });
                const resultado = await resposta.json();
                mostrarToast('success', '🗑️', resultado.mensagem);
                carregarLista();
            }
        }

        async function exportarJSON() {
            try {
                const resposta = await fetch('/exportar_json');
                const dados = await resposta.json();
                const blob = new Blob([JSON.stringify(dados, null, 2)], {type: 'application/json'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `agenda_${new Date().toISOString().slice(0,19)}.json`;
                link.click();
                mostrarToast('success', '✅', 'JSON exportado!');
            } catch(e) {
                mostrarToast('error', '❌', 'Erro ao exportar');
            }
        }

        function fecharModal() {
            document.getElementById('modalEdicao').style.display = 'none';
        }

        carregarLista();
    </script>
</body>
</html>
