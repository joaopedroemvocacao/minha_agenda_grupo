<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Reuniões</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* TELA DE CARREGAMENTO */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots span {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* ESTILOS PRINCIPAIS */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s;
            border: none;
            background: none;
            font-size: 16px;
        }

        .tab:hover {
            background: #e9ecef;
        }

        .tab.active {
            color: #667eea;
            background: white;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-export {
            background: #17a2b8;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-edit {
            background: #ffc107;
            color: #333;
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 8px;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .reuniao-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .reuniao-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .reuniao-nome {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .reuniao-id {
            font-size: 11px;
            color: #6c757d;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .reuniao-detalhes {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        .badge-meet {
            background: #d4f5d4;
            color: #2e7d32;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .badge-presencial {
            background: #ffe0b2;
            color: #e65100;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #adb5bd;
        }

        .login-panel {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .login-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* MODAIS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
        }

        .confirm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 10001;
        }

        .confirm-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .confirm-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-confirm-yes {
            background: #dc3545;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-confirm-no {
            background: #6c757d;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* TOAST */
        .toast-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 10000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            min-width: 280px;
            border-left: 4px solid #28a745;
        }

        .toast-notification.show {
            transform: translateX(0);
        }

        .toast-notification.success { border-left-color: #28a745; }
        .toast-notification.error { border-left-color: #dc3545; }
        .toast-notification.info { border-left-color: #17a2b8; }

        .toast-title { font-weight: 700; margin-bottom: 5px; font-size: 16px; }
        .toast-title.success { color: #28a745; }
        .toast-title.error { color: #dc3545; }

        .toast-message { color: #555; font-size: 14px; }
        .toast-close {
            position: absolute;
            top: 8px;
            right: 12px;
            cursor: pointer;
            color: #999;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .tab { font-size: 12px; padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- TELA DE CARREGAMENTO -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">Carregando<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
            <p style="margin-top: 20px; font-size: 14px; opacity: 0.8;">Agenda de Reuniões</p>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="mainContent" style="display: none;">
        <div class="container">
            <div class="header">
                <h1>📅 Agenda de Reuniões</h1>
                <p>Organize seus compromissos de forma simples e profissional</p>
            </div>

            <div class="main-card">
                <!-- PAINEL DE LOGIN -->
                <div class="login-panel" id="loginPanel">
                    <div id="loginForm" style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <input type="email" id="loginEmail" placeholder="Email" style="width: 200px;">
                        <input type="password" id="loginSenha" placeholder="Senha" style="width: 150px;">
                        <button class="btn-secondary" onclick="fazerLogin()">Entrar</button>
                        <button class="btn-secondary" onclick="mostrarRegistro()">Registrar</button>
                    </div>
                    <div id="userInfo" style="display: none;">
                        <span>👤 <span id="userNome"></span></span>
                        <button class="btn-secondary" onclick="fazerLogout()">Sair</button>
                    </div>
                </div>

                <div class="tabs">
                    <button class="tab active" onclick="switchTab('agendar')">➕ Agendar Reunião</button>
                    <button class="tab" onclick="switchTab('ver')">📋 Ver Agenda</button>
                    <button class="tab" onclick="switchTab('salas')">🏢 Salas</button>
                </div>

                <!-- ABA AGENDAR -->
                <div id="agendarTab" class="tab-content active">
                    <h2>Nova Reunião</h2>
                    <form id="agendaForm">
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label>📝 Título da Reunião</label>
                                <input type="text" id="titulo" placeholder="Ex: Reunião de vendas" required>
                            </div>
                            <div class="form-group full-width">
                                <label>📄 Descrição</label>
                                <textarea id="descricao" rows="3" placeholder="Descrição da reunião..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>📅 Data</label>
                                <input type="date" id="data" required>
                            </div>
                            <div class="form-group">
                                <label>⏰ Horário Início</label>
                                <input type="time" id="horario_inicio" required>
                            </div>
                            <div class="form-group">
                                <label>⏰ Horário Fim</label>
                                <input type="time" id="horario_fim" required>
                            </div>
                            <div class="form-group">
                                <label>📍 Sala</label>
                                <select id="sala_id">
                                    <option value="">Selecione uma sala</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary">✅ Salvar Agendamento</button>
                    </form>
                </div>

                <!-- ABA VER AGENDA -->
                <div id="verTab" class="tab-content">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap;">
                        <h2>Reuniões Agendadas</h2>
                        <div style="display: flex; gap: 10px;">
                            <button onclick="carregarLista()" class="btn-secondary">🔄 Atualizar</button>
                            <button onclick="exportarJSON()" class="btn-export">📋 Exportar JSON</button>
                        </div>
                    </div>
                    <div id="lista"></div>
                </div>

                <!-- ABA SALAS -->
                <div id="salasTab" class="tab-content">
                    <h2>Salas Disponíveis</h2>
                    <div id="salasLista"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE REGISTRO -->
    <div id="modalRegistro" class="modal">
        <div class="modal-content">
            <h3>📝 Registrar</h3>
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="regNome" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="regSenha" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
            </div>
            <button onclick="registrar()" class="btn-primary">Registrar</button>
            <button onclick="fecharModalRegistro()" style="margin-top:10px; width:100%; padding:10px; background:#6c757d; color:white; border:none; border-radius:8px; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div id="modalEdicao" class="modal">
        <div class="modal-content">
            <h3>✏️ Editar Reunião</h3>
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>Título</label>
                <input type="text" id="editTitulo" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="editDescricao" rows="3" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;"></textarea>
            </div>
            <div class="form-group">
                <label>Data</label>
                <input type="date" id="editData" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>Horário Início</label>
                <input type="time" id="editHorarioInicio" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>Horário Fim</label>
                <input type="time" id="editHorarioFim" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>Sala</label>
                <select id="editSalaId" style="width:100%; padding:10px; margin-bottom:15px; border:2px solid #e9ecef; border-radius:8px;"></select>
            </div>
            <button onclick="salvarEdicao()" class="btn-primary">💾 Salvar</button>
            <button onclick="fecharModalEdicao()" style="margin-top:10px; width:100%; padding:10px; background:#6c757d; color:white; border:none; border-radius:8px; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <!-- MODAL DE CONFIRMAÇÃO -->
    <div id="confirmModal" class="confirm-modal">
        <div class="confirm-content">
            <h3>⚠️ Confirmar</h3>
            <p>Tem certeza que deseja cancelar esta reunião?</p>
            <div class="confirm-buttons">
                <button class="btn-confirm-yes" id="confirmYes">Sim, cancelar</button>
                <button class="btn-confirm-no" id="confirmNo">Não, voltar</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toastNotification" class="toast-notification">
        <span class="toast-close" onclick="fecharToast()">&times;</span>
        <div class="toast-title" id="toastTitle">Sucesso</div>
        <div class="toast-message" id="toastMessage">Mensagem</div>
    </div>

    <script>
        let cancelarId = null;

        // TELA DE CARREGAMENTO
        window.addEventListener('load', function() {
            carregarSalas();
            verificarLogin();
            setTimeout(function() {
                document.getElementById('loadingScreen').style.opacity = '0';
                setTimeout(function() {
